<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Itzfizz | Scroll-Driven Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    
    <section class="hero">

      
      <div class="hero__scene hero__scene--one">
        <p class="hero__subtitle">A scroll-driven experience</p>

        <h1 class="hero__title">
          <span class="hero__word">Welcome</span>
          <span class="hero__word hero__word--bold">Itzfizz</span>
        </h1>

        <ul class="hero__stats">
          <li class="stat">
            <span class="stat__number">98%</span>
            <span class="stat__label">Customer Satisfaction</span>
          </li>
          <li class="stat">
            <span class="stat__number">85%</span>
            <span class="stat__label">Repeat Engagement</span>
          </li>
          <li class="stat">
            <span class="stat__number">75%</span>
            <span class="stat__label">Growth Impact</span>
          </li>
        </ul>
      </div>

      
      <div class="hero__scene hero__scene--two">
        <h2 class="hero__reveal">Built to <strong>move</strong><br />with you</h2>
        <p class="hero__reveal-text">Every pixel you scroll drives the motion.</p>
      </div>

      
      <div class="orb" aria-hidden="true">
        <div class="orb__core"></div>
        <div class="orb__ring"></div>
      </div>

      <p class="hero__scroll-hint">Scroll</p>
    </section>

    
    <section class="placeholder">
      <h2>More sections coming soon</h2>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
